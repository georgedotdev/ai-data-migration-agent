# Render: deploys the Docker image (React frontend + FastAPI) as one web service.
# Point the database variables at hosted databases (e.g. Neon Postgres, Aiven MySQL, MongoDB Atlas).
services:
  - type: web
    name: ai-data-migration-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/config
    envVars:
      - key: PG_HOST
        sync: false
      - key: PG_PORT
        sync: false
      - key: PG_USER
        sync: false
      - key: PG_PASSWORD
        sync: false
      - key: PG_DATABASE
        sync: false
      - key: PG_SSLMODE
        value: require
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL_CA_PEM
        sync: false
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
