# One-command local demo:
#   docker compose up --build        -> http://localhost:8000
# Databases only (run the API + frontend from your machine instead):
#   docker compose up -d postgres mysql mongodb
services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_migration_source
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: migration_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.0
    container_name: mysql_migration_target
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: migration_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7
    container_name: mongodb_migration
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Loads the dirty demo tables into PostgreSQL, MySQL and MongoDB, then exits
  # (DuckDB/SQLite sources can be seeded from the app)
  seed:
    build: .
    command: ["python", "data/seed_postgres.py", "postgresql", "mysql", "mongodb"]
    environment: &app_env
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_DATABASE: migration_db
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: migration_db
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: migration_db
      RUNTIME_DIR: /app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  app:
    build: .
    env_file:          # API keys (GOOGLE_API_KEY, ...) from your local .env; values below take precedence
      - path: .env
        required: false
    environment: *app_env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    volumes:
      - runtime_data:/app/runtime

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  runtime_data:
